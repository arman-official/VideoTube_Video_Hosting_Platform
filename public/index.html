<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VideoTube Platform</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>VideoTube Platform</h1>
        <p class="subtitle">Frontend for authentication and account APIs</p>
      </header>

      <section class="panel">
        <h2>Register</h2>
        <form id="registerForm">
          <input name="fullName" placeholder="Full name" required />
          <input name="username" placeholder="Username" required />
          <input type="email" name="email" placeholder="Email" required />
          <input type="password" name="password" placeholder="Password" required />
          <label>Avatar <input type="file" name="avatar" accept="image/*" /></label>
          <label>Cover image <input type="file" name="coverImage" accept="image/*" /></label>
          <button type="submit">Register</button>
        </form>
      </section>

      <section class="panel">
        <h2>Login</h2>
        <form id="loginForm">
          <input name="identity" placeholder="Email or username" required />
          <input type="password" name="password" placeholder="Password" required />
          <button type="submit">Login</button>
        </form>
      </section>

      <section class="panel actions">
        <h2>Account actions</h2>
        <div class="buttons">
          <button id="currentUserBtn" type="button">Get Current User</button>
          <button id="refreshBtn" type="button">Refresh Access Token</button>
          <button id="logoutBtn" type="button">Logout</button>
        </div>
      </section>

      <section class="panel">
        <h2>Update account</h2>
        <form id="updateAccountForm">
          <input name="fullName" placeholder="New full name" required />
          <input type="email" name="email" placeholder="New email" required />
          <button type="submit">Update account</button>
        </form>
      </section>

      <section class="panel">
        <h2>Change password</h2>
        <form id="changePasswordForm">
          <input type="password" name="oldPassword" placeholder="Old password" required />
          <input type="password" name="newPassword" placeholder="New password" required />
          <button type="submit">Change password</button>
        </form>
      </section>

      <section class="panel">
        <h2>Response</h2>
        <pre id="output">Ready.</pre>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
